<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Redirecting...</title>
<meta http-equiv="refresh" content="3; url=https://music.ahscampus.com/">
<script>
(function() {
  // 2. Update the JavaScript redirect variable
  var redirectUrl = "https://music.ahscampus.com/";
  setTimeout(function() {
    window.location.replace(redirectUrl);
  }, 1000);
})();
</script>
</head>
