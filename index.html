<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Portal</title>
<meta http-equiv="refresh" content="3; url=/portal/">
<script>
(function() {
  var redirectUrl = "/portal/";
  setTimeout(function() {
    window.location.replace(redirectUrl);
  }, 3000);
})();
</script>
</head>
<body>
<main role="alert">
<p>Redirecting to <a href="/portal/">the portal page</a>...</p>
<p>If you are not redirected automatically, please <a href="/portal/">go to the portal page</a>.</p>
</main>
</body>
</html>
